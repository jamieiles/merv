<text x="172" y="693" text-anchor="start" font-size="12" font-weight="normal" fill="#444">control</text>
<rect x="300" y="682" width="16" height="12" rx="3" fill="#e9f6ec" stroke="#2f8a46"/>
<text x="322" y="693" text-anchor="start" font-size="12" font-weight="normal" fill="#444">datapath</text>
<rect x="450" y="682" width="16" height="12" rx="3" fill="#fdf1e3" stroke="#c46f12"/>
<text x="472" y="693" text-anchor="start" font-size="12" font-weight="normal" fill="#444">memory</text>
