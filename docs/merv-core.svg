<path d="M380,175 L410,175" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M380,355 L410,355" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M675,175 L690,175" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M790,250 L790,275" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M760,345 L760,370" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="752" y="362" text-anchor="end" font-size="11" fill="#444">yes</text>
<path d="M870,345 L870,505" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="876" y="430" text-anchor="start" font-size="11" fill="#444">no</text>
<path d="M470,545 L470,520" fill="none" stroke="#333" stroke-width="1.6" marker-start="url(#ahs)"/>
<path d="M600,545 L600,520" fill="none" stroke="#333" stroke-width="1.6" marker-start="url(#ahs)"/>
<path d="M40,300 L150,300" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="60" y="295" text-anchor="start" font-size="11" fill="#444">meip</text>
<path d="M40,330 L150,330" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="60" y="325" text-anchor="start" font-size="11" fill="#444">seip</text>
<path d="M40,360 L150,360" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="60" y="355" text-anchor="start" font-size="11" fill="#444">mtip</text>
<path d="M40,390 L150,390" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="60" y="385" text-anchor="start" font-size="11" fill="#444">msip</text>
<text x="40" y="272" text-anchor="start" font-size="12" font-weight="600" fill="#444">interrupts</text>
<path d="M890,572 L1100,572" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="995" y="563" text-anchor="middle" font-size="11" fill="#444">AXI4 to the system</text>
<path d="M40,130 L150,130" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="45" y="125" text-anchor="start" font-size="11" fill="#444">reset_vector</text>
